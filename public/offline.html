<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cc0000" />
    <title>Offline · Canam CRM</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 1.4rem; }
      p { margin: 0 0 20px; color: #475569; line-height: 1.5; }
      button {
        background: #cc0000;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/canam-crm-logo-light.png" alt="Canam CRM" width="220" style="max-width:100%;height:auto;margin-bottom:12px;" />
      <h1>You are offline</h1>
      <p>Canam CRM needs an internet connection to load leads, meetings, and reports. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
