    <script>
      // Initialize Google Maps callback function
      window.initMaps = function() {
        console.log('✅ Google Maps initialized successfully!');
      };

      // Simple Google Maps loading
      window.addEventListener('load', function() {
        console.log('🔍 Checking Google Maps availability...');
        if (window.google && window.google.maps) {
          console.log('✅ Google Maps is available!');
        } else {
          console.log('❌ Google Maps not available yet, waiting...');
          const checkInterval = setInterval(() => {
            if (window.google && window.google.maps) {
              console.log('✅ Google Maps loaded successfully!');
              clearInterval(checkInterval);
            }
          }, 1000);
          
          setTimeout(() => {
            if (!window.google || !window.google.maps) {
              console.warn('⚠️ Google Maps failed to load after 15 seconds');
              clearInterval(checkInterval);
            }
          }, 15000);
        }
      });
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', {
            scope: '/'
          }).then(registration => {
            console.log('✅ Service Worker registered successfully: ', registration);
          }).catch(registrationError => {
            console.warn('⚠️ Service Worker registration failed (non-critical): ', registrationError);
          });
        });
