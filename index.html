    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyS8v3DUUNusLZoVIWaCCUZz7eq4r1vZA&libraries=geometry,places,marker&v=weekly&callback=initMaps&v=565656"></script>
    <script>
      // Initialize Google Maps callback function
      window.initMaps = function() {
        console.log('✅ Google Maps initialized successfully!');
      };

      // Simple Google Maps loading
      window.addEventListener('load', function() {
        console.log('🔍 Checking Google Maps availability...');
        if (window.google && window.google.maps) {
          console.log('✅ Google Maps is available!');
        } else {
          console.log('❌ Google Maps not available yet, waiting...');
          const checkInterval = setInterval(() => {
            if (window.google && window.google.maps) {
              console.log('✅ Google Maps loaded successfully!');
              clearInterval(checkInterval);
            }
          }, 1000);
          
          setTimeout(() => {
            if (!window.google || !window.google.maps) {
              console.warn('⚠️ Google Maps failed to load after 15 seconds');
              clearInterval(checkInterval);
            }
          }, 15000);
        }
      });
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.08), transparent 55%),
          linear-gradient(180deg, #ffffff 0%, #f8fafc 48%, #eef2ff 100%);
        overflow: hidden;
        padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-content {
        position: relative;
        z-index: 1;
        width: min(88vw, 360px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: splash-pop 0.55s ease-out;
      }
      .splash-wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 4px;
      }
      .splash-brand {
        margin: 8px 0 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #111827;
      }
      .splash-sub {
        margin: 2px 0 0;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        color: #cc0000;
      }
      .splash-funnel {
        width: min(78vw, 300px);
        margin: 8px 0 4px;
        filter: drop-shadow(0 18px 28px rgba(79, 70, 229, 0.16));
        animation: splash-funnel-in 0.7s ease-out;
      }
      .splash-funnel img {
        display: block;
        width: 100%;
        height: auto;
        max-height: min(52vh, 340px);
        object-fit: contain;
      }
      .splash-loader {
        width: 24px;
        height: 24px;
        margin-top: 16px;
        border-radius: 50%;
        border: 3px solid #e0e7ff;
        border-top-color: #4f46e5;
        animation: splash-spin 0.75s linear infinite;
      }
      @media (max-height: 700px) {
        .splash-funnel img { max-height: 42vh; }
        .splash-brand { font-size: 1.15rem; }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-funnel-in {
        from { opacity: 0; transform: translateY(16px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.5s ease-out forwards;
      }
    </style>

          <img src="/splash-funnel.png" alt="Attract, Engage, Retain, Grow" />

      </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', {
            scope: '/'
          }).then(registration => {
            console.log('✅ Service Worker registered successfully: ', registration);
          }).catch(registrationError => {
            console.warn('⚠️ Service Worker registration failed (non-critical): ', registrationError);
          });
        });
      }
    </script>
