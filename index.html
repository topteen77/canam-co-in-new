    <script>
      // Initialize Google Maps callback function
      window.initMaps = function() {
        console.log('✅ Google Maps initialized successfully!');
      };

      // Simple Google Maps loading
      window.addEventListener('load', function() {
        console.log('🔍 Checking Google Maps availability...');
        if (window.google && window.google.maps) {
          console.log('✅ Google Maps is available!');
        } else {
          console.log('❌ Google Maps not available yet, waiting...');
          const checkInterval = setInterval(() => {
            if (window.google && window.google.maps) {
              console.log('✅ Google Maps loaded successfully!');
              clearInterval(checkInterval);
            }
          }, 1000);
          
          setTimeout(() => {
            if (!window.google || !window.google.maps) {
              console.warn('⚠️ Google Maps failed to load after 15 seconds');
              clearInterval(checkInterval);
            }
          }, 15000);
        }
      });
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(34, 211, 238, 0.16), transparent 34%),
          linear-gradient(180deg, #020617 0%, #0b1220 58%, #020617 100%);

        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-content {
        position: relative;
        z-index: 1;
        width: min(88vw, 340px);

        flex-direction: column;
        align-items: center;

      .sf-lead { opacity: 0; animation: sf-drop 0.55s ease-out forwards; }
      .sf-lead-1 { animation-delay: 0.35s; }
      .sf-lead-2 { animation-delay: 0.42s; }
      .sf-lead-3 { animation-delay: 0.48s; }
      .sf-lead-4 { animation-delay: 0.54s; }
      .sf-lead-5 { animation-delay: 0.60s; }
      .sf-arrow { opacity: 0; animation: sf-arrow 0.7s ease-out forwards; }
      .sf-arrow-1 { animation-delay: 0.58s; }
      .sf-arrow-2 { animation-delay: 0.64s; }
      .sf-arrow-3 { animation-delay: 0.70s; }
      .sf-layer { transform-box: fill-box; transform-origin: 50% 0%; opacity: 0; animation: sf-layer 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .sf-layer-1 { animation-delay: 0.72s; }
      .sf-layer-2 { animation-delay: 0.86s; }
      .sf-layer-3 { animation-delay: 1.00s; }
      .sf-layer-4 { animation-delay: 1.14s; }
      .sf-copy { opacity: 0; animation: sf-fade 0.4s ease-out forwards; }
      .sf-copy-1 { animation-delay: 0.88s; }
      .sf-copy-2 { animation-delay: 1.02s; }
      .sf-copy-3 { animation-delay: 1.16s; }
      .sf-copy-4 { animation-delay: 1.30s; }
      .sf-tip { opacity: 0; animation: sf-tip 0.45s ease-out 1.35s forwards, sf-pulse 1.6s ease-in-out 1.8s infinite; }
      .sf-glow { opacity: 0; animation: sf-glow 2.2s ease-in-out 1.1s infinite; }
      .splash-loader-track {
        width: min(56vw, 180px);
        height: 4px;
        margin-top: 14px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.22);
        overflow: hidden;
      }
      .splash-loader-bar {
        display: block;
        height: 100%;
        width: 38%;
        border-radius: 999px;
        background: linear-gradient(90deg, #22d3ee, #38bdf8);
        animation: splash-sweep 1.15s ease-in-out infinite;
      }
      @media (max-height: 740px) {
        .splash-funnel svg { max-height: 36vh; }
        .splash-logo { width: min(64vw, 190px); }
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-logo-in {
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      @keyframes sf-drop {
        from { opacity: 0; transform: translateY(-14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes sf-arrow {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes sf-layer {
        from { opacity: 0; transform: translateY(12px) scaleY(0.86); }
        to { opacity: 1; transform: translateY(0) scaleY(1); }
      }
      @keyframes sf-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sf-tip {
        from { opacity: 0; transform: translateY(-6px) scale(0.7); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes sf-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
      @keyframes sf-glow {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.28; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-sub, .splash-loader-bar,
        .sf-lead, .sf-arrow, .sf-layer, .sf-copy, .sf-tip, .sf-glow {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.5s ease-out forwards;
      }
