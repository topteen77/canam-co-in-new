# SSH as GitHub secret DEPLOY_USER (production: user `dev`, keys in /home/dev/.ssh).
# Same commands as on the server:
#   cd /var/www/canam-co-in-new/
#   sudo npm run build
#   sudo pm2 start server/index.js --name new-crm-api
#   sudo pm2 serve dist 3001 --spa --name new-crm-web
# If the build fails or is killed, previous dist/ is restored and PM2 is not restarted.
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Pull, build, and restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            ROOT="${{ secrets.PROD_DEPLOY_PATH }}"
            if [ -z "$ROOT" ]; then
              ROOT="/var/www/canam-co-in-new"
            fi

            echo "==> SSH user: $(whoami) home=$HOME"
            echo "==> App dir: $ROOT"
            cd "$ROOT"

            if [ -x /usr/bin/npm ]; then
              NPM=/usr/bin/npm
            elif [ -x /usr/local/bin/npm ]; then
              NPM=/usr/local/bin/npm
            else
              echo "ERROR: /usr/bin/npm not found"
              exit 1
            fi

            if ! sudo -n "$NPM" --version >/dev/null 2>&1; then
              echo "ERROR: GitHub Actions cannot run sudo npm (password required)."
              echo "On the server as dev, run once:"
              echo "echo 'dev ALL=(root) NOPASSWD: /usr/bin/pm2, /usr/local/bin/pm2, /usr/bin/npm, /usr/local/bin/npm, /usr/bin/npx, /usr/local/bin/npx, /usr/bin/node, /usr/local/bin/node' | sudo tee /etc/sudoers.d/canam-github-deploy"
              echo "sudo chmod 440 /etc/sudoers.d/canam-github-deploy"
              echo "sudo -n $NPM --version"
              exit 1
            fi
            echo "==> sudo $NPM ($($NPM --version))"

            sudo_npm() {
              sudo -n "$NPM" "$@"
            }

            restore_dist() {
              if [ -d "$BACKUP" ]; then
                echo "==> Restoring previous dist/ — live site kept"
                sudo -n rm -rf "$ROOT/dist"
                sudo -n cp -a "$BACKUP" "$ROOT/dist"
                sudo -n chown -R "$(whoami):$(whoami)" "$ROOT/dist" || true
              fi
            }

            BACKUP="/tmp/canam-dist.prev"
            SUCCESS=0
            trap 'if [ "$SUCCESS" != 1 ]; then restore_dist; fi' EXIT

            sudo -n rm -rf "$BACKUP"
            if [ -d dist ] && [ -f dist/index.html ]; then
              sudo -n cp -a dist "$BACKUP"
              echo "==> Live dist backed up to $BACKUP"
            else
              echo "ERROR: live dist/index.html missing; refusing to deploy"
              exit 1
            fi

            echo "==> git fetch/reset origin/main"
            git -c "safe.directory=*" fetch origin main
            git -c "safe.directory=*" checkout main
            git -c "safe.directory=*" reset --hard origin/main

            echo "==> sudo npm ci (server)"
            (cd server && sudo_npm ci)

            echo "==> sudo npm run build"
            sudo_npm run build

            if [ ! -f dist/index.html ]; then
              echo "ERROR: dist/index.html missing after build"
              exit 1
            fi

            echo "==> sudo pm2 new-crm-api"
            if sudo -n pm2 describe new-crm-api >/dev/null 2>&1; then
              sudo -n pm2 restart new-crm-api --update-env
            else
              sudo -n pm2 start server/index.js --name new-crm-api
            fi

            echo "==> sudo pm2 new-crm-web (serve dist :3001 spa)"
            if sudo -n pm2 describe new-crm-web >/dev/null 2>&1; then
              sudo -n pm2 restart new-crm-web
            else
              sudo -n pm2 serve dist 3001 --spa --name new-crm-web
            fi
            sudo -n pm2 save || true
            sudo -n pm2 list

            web_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3001/ || true)"
            echo "==> Frontend :3001 HTTP $web_code"
            if [ "$web_code" != "200" ] && [ "$web_code" != "304" ]; then
              echo "ERROR: frontend check failed"
              sudo -n pm2 restart new-crm-web || true
              exit 1
            fi

            SUCCESS=1
            trap - EXIT
            sudo -n rm -rf "$BACKUP"
            echo "==> Deploy OK $(git rev-parse --short HEAD)"
