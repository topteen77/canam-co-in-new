# SSH as user `dev` (/home/dev/.ssh).
# Vite is built on GitHub (the EC2 OOM-kills `npm run build`).
# Server: git pull, sudo npm ci in server/, unpack dist/, sudo pm2 restart.
# If GitHub build fails, deploy never runs. If unpack fails, live dist/ is restored.
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verify dist
        run: test -f dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy to server
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Pack dist
        run: |
          test -f dist/index.html
          tar -C dist -czf dist.tar.gz .
          tar -tzf dist.tar.gz | grep -E '^(\./)?index.html$'

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: dist.tar.gz
          target: /tmp/canam-co-in-new
          overwrite: true

      - name: Pull, unpack dist, restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            ROOT="${{ secrets.PROD_DEPLOY_PATH }}"
            if [ -z "$ROOT" ]; then
              ROOT="/var/www/canam-co-in-new"
            fi

            echo "==> SSH user: $(whoami) home=$HOME"
            echo "==> App dir: $ROOT"
            cd "$ROOT"

            BACKUP="/tmp/canam-dist.prev"
            STAGING="/tmp/canam-new-dist"
            TARBALL="/tmp/canam-co-in-new/dist.tar.gz"
            SUCCESS=0

            restore_dist() {
              if [ -d "$BACKUP" ]; then
                echo "==> Restoring previous dist/ — live site kept"
                rm -rf "$ROOT/dist"
                cp -a "$BACKUP" "$ROOT/dist"
              fi
            }
            trap 'if [ "$SUCCESS" != 1 ]; then restore_dist; fi' EXIT

            if [ ! -f "$TARBALL" ]; then
              TARBALL="$(find /tmp/canam-co-in-new -name dist.tar.gz | head -1 || true)"
            fi
            test -f "$TARBALL" || { echo "ERROR: missing dist.tar.gz"; exit 1; }

            echo "==> Unpacking $TARBALL to staging (live dist untouched)"
            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            tar -xzf "$TARBALL" -C "$STAGING"
            if [ -f "$STAGING/dist/index.html" ]; then
              NEW_DIST="$STAGING/dist"
            elif [ -f "$STAGING/index.html" ]; then
              NEW_DIST="$STAGING"
            else
              echo "ERROR: index.html not in archive — live site unchanged"
              tar -tzf "$TARBALL" | head -20
              exit 1
            fi
            echo "==> New frontend build OK"

            if [ ! -d dist ] || [ ! -f dist/index.html ]; then
              echo "ERROR: live dist/index.html missing; refusing to deploy"
              exit 1
            fi
            rm -rf "$BACKUP"
            cp -a dist "$BACKUP"
            echo "==> Live dist backed up"

            echo "==> git fetch/reset origin/main"
            git -c "safe.directory=*" fetch origin main
            git -c "safe.directory=*" checkout main
            git -c "safe.directory=*" reset --hard origin/main

            echo "==> sudo npm ci (server only — no Vite on EC2)"
            (cd server && sudo -n /usr/bin/npm ci)

            echo "==> Activating new dist/"
            rm -rf dist
            cp -a "$NEW_DIST" dist
            test -f dist/index.html

            echo "==> sudo pm2 new-crm-api"
            if sudo -n pm2 describe new-crm-api >/dev/null 2>&1; then
              sudo -n pm2 restart new-crm-api --update-env
            else
              sudo -n pm2 start server/index.js --name new-crm-api
            fi

            echo "==> sudo pm2 new-crm-web"
            if sudo -n pm2 describe new-crm-web >/dev/null 2>&1; then
              sudo -n pm2 restart new-crm-web
            else
              sudo -n pm2 serve dist 3001 --spa --name new-crm-web
            fi
            sudo -n pm2 save || true
            sudo -n pm2 list

            web_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3001/ || true)"
            echo "==> Frontend :3001 HTTP $web_code"
            if [ "$web_code" != "200" ] && [ "$web_code" != "304" ]; then
              echo "ERROR: frontend check failed"
              exit 1
            fi

            SUCCESS=1
            trap - EXIT
            rm -rf "$BACKUP" "$STAGING"
            echo "==> Deploy OK $(git rev-parse --short HEAD)"
